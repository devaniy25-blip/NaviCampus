      var map = L.map('map').setView([25.6646, -100.2448], 17);

L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {

}).addTo(map);

        andadoresCoords.forEach(function(linea) {
            var latlngs = linea.map(function(c) { return [c[1], c[0]]; });
            L.polyline(latlngs, { color: "#6c757d", weight: 3, dashArray: "4, 4", opacity: 0.7 }).addTo(map);

        function calcularDistancia(lat1, lon1, lat2, lon2) {
            var R = 6371000;
            var dLat = (lat2 - lat1) * Math.PI / 180;
            var dLon = (lon2 - lon1) * Math.PI / 180;
            var a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                    Math.sin(dLon/2) * Math.sin(dLon/2);
            return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        var nodos = [], grafo = {};
        function obtenerOCrearNodo(lat, lng) {
            for (var i = 0; i < nodos.length; i++) {
                if (calcularDistancia(lat, lng, nodos[i].lat, nodos[i].lng) < 8) return i;
            }
            var id = nodos.length;
            nodos.push({ lat: lat, lng: lng });
            grafo[id] = [];
            return id;
        }

        andadoresCoords.forEach(function(linea) {
            for (var i = 0; i < linea.length - 1; i++) {
                var idA = obtenerOCrearNodo(linea[i][1], linea[i][0]);
                var idB = obtenerOCrearNodo(linea[i+1][1], linea[i+1][0]);
                if (idA !== idB) {
                    var dist = calcularDistancia(nodos[idA].lat, nodos[idA].lng, nodos[idB].lat, nodos[idB].lng);
                    grafo[idA].push({ nodo: idB, peso: dist });
                    grafo[idB].push({ nodo: idA, peso: dist });
                }
            }
        });

        function buscarRutaDijkstra(inicioId, finId) {
            var dist = {}, prev = {}, visitados = new Set(), pq = [];
            for (var i = 0; i < nodos.length; i++) dist[i] = Infinity;
            dist[inicioId] = 0;
            pq.push({ id: inicioId, d: 0 });

            while (pq.length > 0) {
                pq.sort(function(a, b) { return a.d - b.d; });
                var u = pq.shift().id;
                if (u === finId) break;
                if (visitados.has(u)) continue;
                visitados.add(u);

                grafo[u].forEach(function(vecino) {
                    var alt = dist[u] + vecino.peso;
                    if (alt < dist[vecino.nodo]) {
                        dist[vecino.nodo] = alt;
                        prev[vecino.nodo] = u;
                        pq.push({ id: vecino.nodo, d: alt });
                    }
                });
            }

            var camino = [], curr = finId;
            while (curr !== undefined) {
                camino.unshift([nodos[curr].lat, nodos[curr].lng]);
                curr = prev[curr];
            }
            return { camino: camino, distancia: dist[finId] };
        }

        function nodoMasCercano(lat, lng) {
            var mejorId = 0, minD = Infinity;
            for (var i = 0; i < nodos.length; i++) {
                var d = calcularDistancia(lat, lng, nodos[i].lat, nodos[i].lng);
                if (d < minD) { minD = d; mejorId = i; }
            }
            return mejorId;
        }

        var puntoOrigen = null, puntoDestino = null, rutaLinea = null, marcadoresMap = {};

        function obtenerColorEdificio(cat) {
            switch(cat) {
                case 'docencia': return '#007bff';
                case 'lab': return '#fd7e14';
                case 'admin': return '#6f42c1';
                case 'servicios': return '#28a745';
                default: return '#17a2b8';
            }
        }

        L.geoJSON(campusGeoJSON, {
            style: function(feature) {
                var colorCat = obtenerColorEdificio(feature.properties.cat);
                return { color: "#333333", weight: 1.5, fillColor: colorCat, fillOpacity: 1.0 };
            },
            onEachFeature: function(feature, layer) {
                var props = feature.properties;
                var idEdificio = props.Id;
                var nombreCompleto = props.nombre;
                var center = layer.getBounds().getCenter();

                    direction: 'center',
                    className: 'label-edificio'

                        <div style="display:flex; gap:5px; justify-content:center;">

                                📍 Salir de aquí
                            </button>
                            <button onclick="setDestino(${center.lat}, ${center.lng}, '${nombreCompleto}')"

                                🏁 Ir aquí
                            </button>

        window.setOrigen = function(lat, lng, nombre) {
            puntoOrigen = { lat: lat, lng: lng, nombre: nombre };
            alert("Origen seleccionado: " + nombre + "\n\nAhora selecciona el destino y presiona '🏁 Ir aquí'.");

        };

        window.setDestino = function(lat, lng, nombre) {
            puntoDestino = { lat: lat, lng: lng, nombre: nombre };

                alert("Destino seleccionado: " + nombre + "\n\nPor favor, selecciona primero el origen con '📍 Salir de aquí'.");
            } else {

            }
        };

            return div;
        };
        navControl.addTo(map);

        function calcularRutaInterna() {
            if (!puntoOrigen || !puntoDestino) return;
            if (rutaLinea) map.removeLayer(rutaLinea);

            var idInicio = nodoMasCercano(puntoOrigen.lat, puntoOrigen.lng);
            var idFin = nodoMasCercano(puntoDestino.lat, puntoDestino.lng);
            var resultado = buscarRutaDijkstra(idInicio, idFin);

            var latlngs = [[puntoOrigen.lat, puntoOrigen.lng]]
                .concat(resultado.camino)
                .concat([[puntoDestino.lat, puntoDestino.lng]]);

            rutaLinea = L.polyline(latlngs, {
                color: '#28a745',
                weight: 6,
                opacity: 0.9,
                dashArray: '8, 8'
            }).addTo(map);

            var metros = Math.round(resultado.distancia);
            var minutos = Math.ceil(metros / 70);
            map.fitBounds(rutaLinea.getBounds(), { padding: [50, 50] });

            var panel = document.getElementById('panelInstrucciones');
            if (panel) {
                panel.innerHTML = `
                    <b>🚶 Guía de Navegación ITNL</b><br>
                    <b>Origen:</b> ${puntoOrigen.nombre}<br>
                    <b>Destino:</b> ${puntoDestino.nombre}<br>
                    <hr style="margin:5px 0; border:0; border-top:1px solid #ddd;">
                    <b>Paso 1:</b> Dirígete hacia el andador desde <b>${puntoOrigen.nombre}</b>.<br>
                    <b>Paso 2:</b> Sigue el trayecto marcado en la línea verde sobre los pasillos.<br>
                    <b>Paso 3:</b> Llegada estimada a <b>${puntoDestino.nombre}</b>.<br>
                    <span style="color:#28a745; font-weight:bold; display:block; margin-top:4px;">📏 Distancia: ~${metros}m (${minutos} min a pie)</span>
                `;
            }
        }

        var searchControl = L.control({ position: 'topright' });
        searchControl.onAdd = function () {
            var div = L.DomUtil.create('div', 'search-box');
            var options = Object.keys(marcadoresMap).sort().map(function(n) {
                return `<option value="${n}">${n}</option>`;
            }).join('');
            div.innerHTML = `
                <div style="background: white; padding: 8px; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.3);">
                    <label style="font-size: 12px; font-weight: bold; display: block; margin-bottom: 4px;">🔍 Buscar Edificio:</label>
                    <select id="selectEdificio" onchange="seleccionarEdificioBuscador(this.value)" style="padding: 4px; font-size: 12px; border-radius: 4px;">
                        <option value="">-- Selecciona un edificio --</option>
                        ${options}
                    </select>
                </div>`;
            return div;
        };
        searchControl.addTo(map);

        window.seleccionarEdificioBuscador = function(nombreEdificio) {
            if (!nombreEdificio) return;
            var item = marcadoresMap[nombreEdificio];
            if (item) {
                map.setView(item.latlng, 19);
                item.layer.openPopup();
            }
        }
    </script>
</body>
</html>
